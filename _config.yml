# Site
title: Ray思世界
subtitle: ""
description: 记录值得反复思考的问题，以及逐渐清晰的答案。
keywords:
  - 写作
  - 思考
  - 个人博客
author: Ray
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://mysterious-2001.github.io
root: /
permalink: posts/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
category_map:
  生活思考: life
  专业知识: knowledge
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: false
  auto_detect: false
  tab_replace: "  "
  wrap: true
  hljs: false

# Home page
index_generator:
  path: ""
  per_page: 10
  order_by: -date

# Pagination
per_page: 10
pagination_dir: page

# Theme
theme: ink

# Deployment is handled by .github/workflows/pages.yml
